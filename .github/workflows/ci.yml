name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Install · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + web-ext lint)
        run: npm run lint

      - name: Build extension
        run: npm run build

      - name: Upload dist/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowshield-dist-${{ github.sha }}
          path: dist/
          retention-days: 7
