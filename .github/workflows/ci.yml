name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Install · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        
      - name: Build extension
        run: npm run build

      - name: Run ESLint
        run: npx eslint src/

      - name: Check extension with Firefox
        run: |
          mkdir -p /tmp/firefox-dist
          cp -R dist/. /tmp/firefox-dist/

          node -e "const fs=require('fs'); const p='/tmp/firefox-dist/manifest.json'; const m=JSON.parse(fs.readFileSync(p,'utf8')); if(m.background) delete m.background.service_worker; fs.writeFileSync(p, JSON.stringify(m,null,2)+'\n');"

          npx web-ext lint --source-dir=/tmp/firefox-dist --warnings-as-errors --ignore-files "rules/*.json"

      - name: Unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Upload dist/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadowshield-dist-${{ github.sha }}
          path: dist/
          retention-days: 7
