<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowShield</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="blocking.css">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <svg class="shield-icon" viewBox="0 0 32 36" aria-hidden="true">
                <path d="M16 2 29 7v9c0 8.7-5.5 14.7-13 18C8.5 30.7 3 24.7 3 16V7l13-5Z"></path>
                <path d="m10 17 4 4 8-9"></path>
            </svg>
            <div>
                <h1>ShadowShield</h1>
                <p>Masking device identity and timezone.</p>
            </div>
        </div>
        <span class="status-pill">Active</span>
    </header>

    <main id="app">
        <p id="load-error" class="message error" hidden></p>

        <section class="card" aria-labelledby="site-title">
            <div class="section-heading">
                <h2 id="site-title">This site</h2>
                <span id="site-origin" class="muted"></span>
            </div>
            <div id="current-site"></div>
        </section>

        <section class="card" aria-labelledby="blocking-title">
            <h2 id="blocking-title">Trackers and ads</h2>
            <p id="blocking-summary" class="blocking-summary">Checking this page...</p>
            <p id="blocking-error" class="message error" hidden></p>
            <label class="setting-row" for="blocking-trackers-toggle">
                <span>
                    <strong>Block trackers</strong>
                    <small>Analytics, tracking pixels and similar.</small>
                </span>
                <input id="blocking-trackers-toggle" type="checkbox">
            </label>
            <label class="setting-row" for="blocking-ads-toggle">
                <span>
                    <strong>Block ads</strong>
                    <small>Requests to known ad networks.</small>
                </span>
                <input id="blocking-ads-toggle" type="checkbox">
            </label>
            <label class="setting-row" for="blocking-site-toggle">
                <span>
                    <strong>Block on this site</strong>
                    <small id="blocking-site-name"></small>
                </span>
                <input id="blocking-site-toggle" type="checkbox">
            </label>
            <small id="blocking-lists" class="muted blocking-lists"></small>
        </section>

        <section class="card" aria-labelledby="read-title">
            <h2 id="read-title">What was read</h2>
            <div id="summary"></div>
        </section>

        <section id="frames-card" class="card" aria-labelledby="frames-title" hidden>
            <h2 id="frames-title">Embedded sources</h2>
            <p class="muted">Frames inside this page that read your signals.</p>
            <div id="frames"></div>
        </section>

        <details class="card">
            <summary>Recent activity</summary>
            <div id="detections"></div>
        </details>

        <details class="card">
            <summary>All websites</summary>
            <div id="all-sites"></div>
        </details>

        <details class="card">
            <summary>Settings</summary>
            <label class="setting-row" for="webrtc-toggle">
                <span>
                    <strong>Hide my real IP from WebRTC</strong>
                    <small>Uses Firefox's privacy setting; most useful with a VPN.</small>
                </span>
                <input id="webrtc-toggle" type="checkbox">
            </label>
            <p id="webrtc-status" class="setting-status"></p>
        </details>

        <details class="card">
            <summary>What ShadowShield pretends to be</summary>
            <div id="protection-status"></div>
        </details>
    </main>

    <footer>
        <button id="clear-data" class="secondary-button" type="button">Clear data</button>
    </footer>

    <script src="popup.js"></script>
    <script src="blocking.js"></script>
</body>
</html>
